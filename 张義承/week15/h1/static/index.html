<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>情感陪伴 · LangGraph / openai-agents</title>
<style>
  :root {
    --bg: #0f1116;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2b3040;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --pos: #3fb950;
    --neg: #f0883e;
    --neu: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .fw { display: flex; gap: 6px; margin-left: auto; }
  .fw label {
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer; color: var(--muted); font-size: 13px; user-select: none;
  }
  .fw input { display: none; }
  .fw input:checked + span { color: var(--text); }
  .fw label:has(input:checked) { background: #24304a; border-color: var(--accent); color: var(--text); }
  #status { font-size: 12px; color: var(--muted); }
  #status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #666; margin-right: 5px; }
  #status.ok .dot { background: var(--pos); }
  #status.bad .dot { background: #f85149; }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { display: flex; margin-bottom: 16px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 11px 15px; border-radius: 14px;
    background: var(--panel-2); border: 1px solid var(--line); white-space: pre-wrap;
  }
  .msg.user .bubble { background: #24304a; border-color: #33436b; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .tag.pos { color: var(--pos); border-color: #2b5a36; }
  .tag.neg { color: var(--neg); border-color: #6b4522; }
  .tag.neu { color: var(--neu); }
  .tag.fw { color: var(--accent); border-color: #33436b; }
  details { margin-top: 8px; }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  details ol { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 40px; }

  footer { padding: 14px 20px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  .input-row { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 11px 14px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    padding: 11px 20px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--accent); color: #0b1020; font-weight: 600; font-size: 14px;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .samples { max-width: 820px; margin: 0 auto 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .samples span {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px dashed var(--line); color: var(--muted); cursor: pointer;
  }
  .samples span:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>情感陪伴</h1>
  <span id="status"><span class="dot"></span>检测中…</span>
  <div class="fw">
    <label><input type="radio" name="fw" value="langgraph" checked /><span>LangGraph</span></label>
    <label><input type="radio" name="fw" value="openai-agents" /><span>openai-agents</span></label>
  </div>
</header>

<main>
  <div class="wrap" id="chat">
    <p class="hint">说说你现在的心情吧。正向的会被鼓励，负向的会被好好排解。</p>
  </div>
</main>

<footer>
  <div class="samples">
    <span>今天面试通过了，特别开心！</span>
    <span>最近作业太多，压力好大，晚上睡不着。</span>
    <span>明天几点开会？</span>
  </div>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="输入你现在想说的话，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');

const MODE_LABEL = { encourage: '鼓励', comfort: '排解', neutral: '陪伴' };
const SENT_LABEL = { positive: '正向', negative: '负向', neutral: '中性' };
const SENT_CLASS = { positive: 'pos', negative: 'neg', neutral: 'neu' };

let busy = false;

function currentFramework() {
  return document.querySelector('input[name="fw"]:checked').value;
}

function addUser(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  scrollBottom();
}

function addBot(data) {
  const emo = data.emotion || {};
  const cls = SENT_CLASS[emo.sentiment] || 'neu';
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="bubble">
      <div class="meta">
        <span class="tag ${cls}">情感：${SENT_LABEL[emo.sentiment] || '中性'} · ${escapeHtml(emo.emotion || '')}</span>
        <span class="tag">置信度 ${emo.confidence ?? '-'}</span>
        <span class="tag ${cls}">策略：${MODE_LABEL[data.mode] || data.mode}</span>
        <span class="tag fw">${escapeHtml(data.framework || '')}</span>
      </div>
      <div class="body"></div>
      <details>
        <summary>查看调用链路</summary>
        <ol>${(data.trace || []).map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ol>
      </details>
    </div>`;
  div.querySelector('.body').textContent = data.reply || '';
  chat.appendChild(div);
  scrollBottom();
}

function addError(msg) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = '<div class="bubble" style="border-color:#6b2222;color:#ff9d9d"></div>';
  div.querySelector('.bubble').textContent = '出错了：' + msg;
  chat.appendChild(div);
  scrollBottom();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function scrollBottom() {
  const main = document.querySelector('main');
  main.scrollTop = main.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  addUser(text);

  const placeholder = document.createElement('div');
  placeholder.className = 'msg bot';
  placeholder.innerHTML = '<div class="bubble" style="color:#8b93a7">思考中…</div>';
  chat.appendChild(placeholder);
  scrollBottom();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, framework: currentFramework() }),
    });
    const data = await res.json();
    placeholder.remove();
    if (!res.ok) addError(data.detail || res.statusText);
    else addBot(data);
  } catch (e) {
    placeholder.remove();
    addError(e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
document.querySelectorAll('.samples span').forEach(el => {
  el.addEventListener('click', () => { input.value = el.textContent; input.focus(); });
});

async function checkHealth() {
  try {
    const res = await fetch('/api/health');
    const h = await res.json();
    const ok = h.process1_emotion?.ok && h.process2_respond?.ok;
    statusEl.className = ok ? 'ok' : 'bad';
    statusEl.innerHTML = `<span class="dot"></span>` + (ok
      ? `进程1/进程2 正常 · ${h.model}`
      : '进程1/进程2 未就绪，请先启动两个服务');
  } catch {
    statusEl.className = 'bad';
    statusEl.innerHTML = '<span class="dot"></span>后端未连接';
  }
}
checkHealth();
setInterval(checkHealth, 5000);
input.focus();
</script>
</body>
</html>
