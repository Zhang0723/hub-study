# 数据源与关键词配置
#
# sources: 可直连的列表页。实测 2026-11-26 的可达性见 references/sources.md。
#   list_url  列表页首页；翻页规则是 list_url + "/index_{n}.html"
#   enabled   是否启用
#   delay     每页之间的休眠秒数（政务站点对频率敏感）
#
# 注意：www.ccgp.gov.cn 等国家级站点封本机 IP，不要加进来。

sources:
  - name: 河北-中标公告
    list_url: https://ccgp-hebei.gov.cn/province/cggg/zhbgg/
    enabled: true
    delay: 2
  - name: 河北-采购公告
    list_url: https://ccgp-hebei.gov.cn/province/cggg/gzgg/
    enabled: true
    delay: 2

keywords:
  # 具体词，命中其一即判定相关（避免"碳素钢管"这类噪声）
  must:
    - ESG
    - 双碳
    - 碳排放
    - 碳足迹
    - 碳交易
    - 碳资产
    - 碳普惠
    - 碳核查
    - 碳汇
    - 温室气体
    - 可持续发展
    - 绿色低碳
    - 绿色工厂
    - 绿色矿山
    - 绿色供应链
    - 绿色电力
    - 绿色建筑
    - 节能降碳
    - 节能改造
    - 零碳
    - 低碳园区
    - 清洁能源
    - 新能源
    - 循环经济
    - 污染防治
    - 环保
    - 生态保护
    - 环境监测
    - 排污许可
    - ESG评价
    - 责任治理

  # 泛词，需要同时命中两个以上才算相关
  any:
    - 碳
    - 绿色
    - 低碳
    - 节能
    - 环保
    - 环境
    - 生态
    - 能源
    - 可持续
    - 评估
    - 认证
    - 核查
    - 咨询
  any_min_hits: 2

  # 排除词：命中即丢弃
  exclude:
    - 碳钢管
    - 碳粉
    - 碳刷
    - 碳酸钙
    - 碳晶
    - 碳纤维板
    - 煤炭价格
    - 碳排放配额转让异常

categories:
  - ESG报告编制
  - 碳足迹核算
  - 碳排放核查
  - 节能降碳改造
  - 绿色工厂认证
  - 绿色供应链
  - 碳资产管理
  - 碳普惠
  - 低碳咨询规划
  - 环保检测
  - 循环经济
  - 其他

# 金额分档（元），用于分布分析
amount_buckets:
  - {name: "10万以下", max: 100000}
  - {name: "10-50万", min: 100000, max: 500000}
  - {name: "50-100万", min: 500000, max: 1000000}
  - {name: "100-500万", min: 1000000, max: 5000000}
  - {name: "500-1000万", min: 5000000, max: 10000000}
  - {name: "1000万以上", min: 10000000}
