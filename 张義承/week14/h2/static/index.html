<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多模态 RAG 问答</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e5e7eb; --text: #1f2328;
    --muted: #6b7280; --accent: #2563eb; --ok: #16a34a; --warn: #d97706;
    --err: #dc2626; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { flex: 1; display: flex; min-height: 0; padding: 16px; gap: 16px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .left { width: 360px; flex: none; }
  .right { flex: 1; }
  .panel-head {
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .panel-head .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px; }

  /* 上传区 */
  .uploader {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
  }
  .uploader:hover, .uploader.drag { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
  .uploader input { display: none; }

  /* 文档列表 */
  .doc {
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px;
  }
  .doc .name { font-weight: 500; word-break: break-all; }
  .doc .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
    margin-top: 6px;
  }
  .badge.pending { background: #f3f4f6; color: var(--muted); }
  .badge.parsing { background: #fef3c7; color: var(--warn); }
  .badge.done    { background: #dcfce7; color: var(--ok); }
  .badge.error   { background: #fee2e2; color: var(--err); }

  /* 对话区 */
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid;
    place-items: center; font-size: 13px; background: #e5e7eb;
  }
  .msg.user .avatar { background: var(--accent); color: #fff; }
  .msg .bubble {
    background: #f9fafb; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; max-width: 78%; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: #eff6ff; border-color: #dbeafe; }
  .bubble img { max-width: 100%; border-radius: 6px; margin: 6px 0; border: 1px solid var(--line); }
  .bubble p { margin: 6px 0; }
  .bubble pre {
    background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto;
  }
  .bubble table { border-collapse: collapse; margin: 8px 0; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 4px 8px; }
  .sources { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .sources summary { cursor: pointer; }
  .note { font-size: 12px; color: var(--warn); margin-top: 6px; }
  .typing { color: var(--muted); font-size: 13px; }

  /* 输入区 */
  .composer { border-top: 1px solid var(--line); padding: 10px 12px; }
  .preview { display: none; align-items: center; gap: 8px; margin-bottom: 8px; }
  .preview img { height: 48px; border-radius: 6px; border: 1px solid var(--line); }
  .preview button { border: 0; background: none; color: var(--err); cursor: pointer; font-size: 16px; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font: inherit; outline: none; min-height: 42px; max-height: 140px;
  }
  textarea:focus { border-color: var(--accent); }
  button.primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; font: inherit;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.icon {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    width: 42px; height: 42px; cursor: pointer; font-size: 17px;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>📄 多模态 RAG 问答</h1>
  <span class="meta" id="meta"></span>
</header>

<main>
  <!-- 左：上传 + 文档状态 -->
  <section class="panel left">
    <div class="panel-head">文档 <span class="count" id="docCount"></span></div>
    <div class="panel-body">
      <label class="uploader" id="uploader">
        <input type="file" id="fileInput" accept="application/pdf" multiple />
        <div>点击或拖拽 PDF 到这里</div>
        <div style="font-size:12px;margin-top:4px">支持一次选择多个</div>
      </label>
      <div id="docList"></div>
    </div>
  </section>

  <!-- 右：对话 -->
  <section class="panel right">
    <div class="panel-head">对话</div>
    <div class="messages" id="messages">
      <div class="msg assistant">
        <div class="avatar">AI</div>
        <div class="bubble">
          上传 PDF 后等状态变成「解析完成」，就可以提问了。<br />
          提问时可以点左下角 📎 附一张图片，跟问题一起发给模型。
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="preview" id="preview">
        <img id="previewImg" alt="预览" />
        <button id="clearImg" title="移除">✕</button>
      </div>
      <div class="input-row">
        <button class="icon" id="attachBtn" title="附带图片提问">📎</button>
        <input type="file" id="imageInput" accept="image/*" style="display:none" />
        <textarea id="question" rows="1" placeholder="围绕已解析的文档提问，Shift+Enter 换行，Enter 发送"></textarea>
        <button class="primary" id="sendBtn">发送</button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STATUS_TEXT = { pending: "待解析", parsing: "解析中", done: "解析完成", error: "解析失败" };

let chatImage = null; // data URL

// ---------------- 文档上传与状态 ----------------
async function refreshDocs() {
  try {
    const res = await fetch("/api/docs");
    const data = await res.json();
    renderDocs(data.docs, data.summary);
  } catch (e) {
    $("docCount").textContent = "连接失败";
  }
}

function renderDocs(docs, summary) {
  $("docCount").textContent = docs.length
    ? `共 ${docs.length} 个 · 待解析 ${summary.pending} · 解析中 ${summary.parsing} · 完成 ${summary.done}`
    : "";
  $("docList").innerHTML = docs.map((d) => {
    const s = d.status || "pending";
    const extra = s === "done"
      ? ` · ${d.chunks ?? 0} 块 · ${d.images ?? 0} 图 · ${d.parser || ""}`
      : "";
    const msg = d.message ? `<div class="sub">${escapeHtml(d.message)}</div>` : "";
    return `<div class="doc">
      <div class="name">${escapeHtml(d.filename || d.doc_id)}</div>
      <span class="badge ${s}">${STATUS_TEXT[s] || s}</span>
      <div class="sub">${formatSize(d.size)}${extra}</div>
      ${msg}
    </div>`;
  }).join("");
}

function formatSize(bytes) {
  if (!bytes) return "";
  const mb = bytes / 1024 / 1024;
  return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
}

async function uploadFiles(files) {
  const pdfs = [...files].filter((f) => f.name.toLowerCase().endsWith(".pdf"));
  if (!pdfs.length) return;
  const fd = new FormData();
  pdfs.forEach((f) => fd.append("files", f));
  try {
    const res = await fetch("/api/upload", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "上传失败");
    if (data.rejected?.length) {
      alert("部分文件未接受：\n" + data.rejected.map((r) => `${r.filename}: ${r.reason}`).join("\n"));
    }
  } catch (e) {
    alert("上传失败：" + e.message);
  }
  refreshDocs();
}

// ---------------- 聊天 ----------------
function addMessage(role, html) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}`;
  wrap.innerHTML = `<div class="avatar">${role === "user" ? "我" : "AI"}</div>
                    <div class="bubble">${html}</div>`;
  $("messages").appendChild(wrap);
  $("messages").scrollTop = $("messages").scrollHeight;
  return wrap;
}

function renderMarkdown(text) {
  if (window.marked) return marked.parse(text);
  return escapeHtml(text).replace(/\n/g, "<br>");
}

async function send() {
  const q = $("question").value.trim();
  if (!q) return;

  const bubble = chatImage ? `<div>${escapeHtml(q)}</div><img src="${chatImage}" alt="附图" />` : escapeHtml(q);
  addMessage("user", bubble);
  $("question").value = "";
  const img = chatImage;
  clearImage();

  const btn = $("sendBtn");
  btn.disabled = true;
  const pending = addMessage("assistant", `<span class="typing">思考中…</span>`);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, image: img }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "请求失败");

    let html = renderMarkdown(data.answer);
    if (data.notes?.length) {
      html += `<div class="note">${data.notes.map(escapeHtml).join("<br>")}</div>`;
    }
    if (data.sources?.length) {
      const items = data.sources
        .map((s) => `<li>${escapeHtml(s.filename)}${s.heading ? " · " + escapeHtml(s.heading) : ""}</li>`)
        .join("");
      html += `<details class="sources"><summary>引用 ${data.sources.length} 段资料</summary><ul>${items}</ul></details>`;
    }
    pending.querySelector(".bubble").innerHTML = html;
  } catch (e) {
    pending.querySelector(".bubble").innerHTML = `<span style="color:#dc2626">请求失败：${escapeHtml(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
  $("messages").scrollTop = $("messages").scrollHeight;
}

// ---------------- 图片附件 ----------------
function clearImage() {
  chatImage = null;
  $("preview").style.display = "none";
  $("previewImg").src = "";
  $("imageInput").value = "";
}

$("imageInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    chatImage = reader.result;
    $("previewImg").src = chatImage;
    $("preview").style.display = "flex";
  };
  reader.readAsDataURL(file);
});

// ---------------- 事件绑定 ----------------
$("uploader").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => uploadFiles(e.target.files));

const uploader = $("uploader");
["dragenter", "dragover"].forEach((ev) =>
  uploader.addEventListener(ev, (e) => { e.preventDefault(); uploader.classList.add("drag"); })
);
["dragleave", "drop"].forEach((ev) =>
  uploader.addEventListener(ev, (e) => { e.preventDefault(); uploader.classList.remove("drag"); })
);
uploader.addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));

$("attachBtn").addEventListener("click", () => $("imageInput").click());
$("clearImg").addEventListener("click", clearImage);
$("sendBtn").addEventListener("click", send);
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// ---------------- 启动 ----------------
fetch("/api/health").then((r) => r.json()).then((h) => {
  const icon = h.mineru ? "MinerU" : "PyMuPDF(降级)";
  $("meta").textContent = `模型 ${h.model} · 解析器 ${icon} · Kafka ${h.kafka ? "已连接" : "未连接"}`;
}).catch(() => {});

refreshDocs();
setInterval(refreshDocs, 2000);
</script>
</body>
</html>
